<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Battle of Kursk 1943 - Armored Simulation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      padding: 10px 14px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .badge {
      background: #dc2626;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    #canvas-container {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 11px;
      font-weight: 600;
    }
    .stat-box {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.25);
      padding: 6px 10px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }
    .hp-bar {
      width: 90px;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      margin-top: 4px;
      overflow: hidden;
    }
    .hp-fill { height: 100%; transition: width 0.2s; }
    #controls {
      padding: 12px;
      background: #0f172a;
      border-top: 1px solid #1e293b;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    button {
      padding: 12px 10px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      color: white;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.97); }
    .btn-ussr { background: #b91c1c; }
    .btn-ger { background: #334155; border: 1px solid #64748b; }
    .btn-rec { background: #0284c7; }
    .btn-rec.recording { background: #e11d48; animation: pulse 1s infinite; }
    .btn-reset { background: #1e293b; color: #cbd5e1; }
    @keyframes pulse { 50% { opacity: 0.7; } }
  </style>
</head>
<body>

  <header>
    <div><strong>KURSK 1943</strong> · Prokhorovka Sector</div>
    <span class="badge">PURE JS ENGINE</span>
  </header>

  <div id="canvas-container">
    <canvas id="battlefield"></canvas>
    <div id="hud">
      <div class="stat-box">
        <div>USSR: T-34/76</div>
        <div class="hp-bar"><div id="hp-t34" class="hp-fill" style="width:100%; background:#ef4444;"></div></div>
      </div>
      <div class="stat-box" style="text-align:right;">
        <div>GER: Pz.Kpfw. VI Tiger</div>
        <div class="hp-bar"><div id="hp-tiger" class="hp-fill" style="width:100%; background:#94a3b8;"></div></div>
      </div>
    </div>
  </div>

  <div id="controls">
    <button class="btn-ussr" onclick="fireTank('t34')">FIRE T-34 (76mm)</button>
    <button class="btn-ger" onclick="fireTank('tiger')">FIRE TIGER (88mm)</button>
    <button id="rec-btn" class="btn-rec" onclick="toggleRecording()">● REC VIDEO</button>
    <button class="btn-reset" onclick="resetBattle()">RESET SECTOR</button>
  </div>

  <script>
    const canvas = document.getElementById('battlefield');
    const ctx = canvas.getContext('2d');
    let W, H, groundY;

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      W = canvas.width = rect.width;
      H = canvas.height = rect.height;
      groundY = H * 0.74;
    }
    window.addEventListener('resize', resize);
    resize();

    // Procedural Web Audio (No external MP3 needed)
    let audioCtx = null;
    function playExplosionSound(isHeavy = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const duration = isHeavy ? 0.9 : 0.6;
      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * (isHeavy ? 0.25 : 0.16)));
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(isHeavy ? 280 : 420, audioCtx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + duration);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(isHeavy ? 0.9 : 0.65, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    // Entities & Physics State
    let shake = 0;
    let shells = [];
    let particles = [];
    let craters = [];

    const state = {
      t34: { x: 0, hp: 100, maxHp: 100, recoil: 0, speed: 0.45, color: '#3f6212', turret: '#4d7c0f' },
      tiger: { x: 0, hp: 140, maxHp: 140, recoil: 0, speed: -0.22, color: '#475569', turret: '#64748b' }
    };

    function resetBattle() {
      state.t34.x = W * 0.18;
      state.t34.hp = 100;
      state.tiger.x = W * 0.82;
      state.tiger.hp = 140;
      shells = [];
      particles = [];
      craters = [];
      updateHud();
    }
    resetBattle();

    function updateHud() {
      document.getElementById('hp-t34').style.width = Math.max(0, (state.t34.hp / state.t34.maxHp) * 100) + '%';
      document.getElementById('hp-tiger').style.width = Math.max(0, (state.tiger.hp / state.tiger.maxHp) * 100) + '%';
    }

    function spawnParticles(x, y, count, colorList, speedScale = 1) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 4 + 1) * speedScale;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1,
          size: Math.random() * 8 + 3,
          alpha: 1,
          decay: Math.random() * 0.025 + 0.015,
          color: colorList[Math.floor(Math.random() * colorList.length)]
        });
      }
    }

    function fireTank(who) {
      const isT34 = who === 't34';
      const shooter = isT34 ? state.t34 : state.tiger;
      if (shooter.hp <= 0) return;

      shooter.recoil = isT34 ? 10 : 14;
      shake = isT34 ? 6 : 10;
      playExplosionSound(!isT34);

      const dir = isT34 ? 1 : -1;
      const muzzleX = shooter.x + dir * (isT34 ? 62 : 76);
      const muzzleY = groundY - (isT34 ? 32 : 38);

      shells.push({
        owner: who,
        x: muzzleX,
        y: muzzleY,
        vx: dir * (isT34 ? 11 : 14),
        vy: -1.4,
        damage: isT34 ? 28 : 45
      });

      spawnParticles(muzzleX, muzzleY, 18, ['#fb923c', '#facc15', '#94a3b8'], 1.2);
    }

    // Auto-combat AI timer for continuous cinematic action
    setInterval(() => {
      if (state.t34.hp > 0 && state.tiger.hp > 0) {
        Math.random() > 0.45 ? fireTank('t34') : fireTank('tiger');
      }
    }, 2600);

    function drawBackground() {
      // Dramatic Kursk smoke-filled sky
      const sky = ctx.createLinearGradient(0, 0, 0, groundY);
      sky.addColorStop(0, '#0f172a');
      sky.addColorStop(0.55, '#334155');
      sky.addColorStop(1, '#78350f');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, groundY);

      // Distant horizon fires
      ctx.fillStyle = 'rgba(234, 88, 12, 0.25)';
      ctx.beginPath();
      ctx.arc(W * 0.3, groundY, 70, Math.PI, 0);
      ctx.arc(W * 0.72, groundY, 90, Math.PI, 0);
      ctx.fill();

      // Steppe Ground
      ctx.fillStyle = '#1c1917';
      ctx.fillRect(0, groundY, W, H - groundY);
      ctx.fillStyle = '#292524';
      ctx.fillRect(0, groundY, W, 8);

      // Shell craters
      craters.forEach(cx => {
        ctx.fillStyle = '#0c0a09';
        ctx.beginPath();
        ctx.ellipse(cx, groundY + 4, 14, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawT34(t) {
      if (t.hp <= 0) return;
      const x = t.x - t.recoil;
      // Tracks
      ctx.fillStyle = '#090d16';
      ctx.beginPath(); ctx.roundRect(x - 38, groundY - 14, 76, 14, 6); ctx.fill();
      // Sloped Hull (Iconic T-34 silhouette)
      ctx.fillStyle = t.color;
      ctx.beginPath();
      ctx.moveTo(x - 35, groundY - 14);
      ctx.lineTo(x - 28, groundY - 26);
      ctx.lineTo(x + 26, groundY - 26);
      ctx.lineTo(x + 38, groundY - 14);
      ctx.closePath(); ctx.fill();
      // Rounded Turret & 76mm Gun
      ctx.fillStyle = t.turret;
      ctx.beginPath(); ctx.roundRect(x - 14, groundY - 38, 32, 13, 5); ctx.fill();
      ctx.fillRect(x + 18, groundY - 34, 44, 4);
    }

    function drawTiger(t) {
      if (t.hp <= 0) return;
      const x = t.x + t.recoil;
      // Wide Heavy Tracks
      ctx.fillStyle = '#090d16';
      ctx.beginPath(); ctx.roundRect(x - 46, groundY - 16, 92, 16, 5); ctx.fill();
      // Boxy Heavy Hull
      ctx.fillStyle = t.color;
      ctx.fillRect(x - 44, groundY - 31, 88, 16);
      // Heavy Turret & 88mm KwK 36 Cannon
      ctx.fillStyle = t.turret;
      ctx.fillRect(x - 20, groundY - 45, 42, 15);
      ctx.fillRect(x - 76, groundY - 40, 56, 5);
      // Muzzle Brake
      ctx.fillRect(x - 80, groundY - 42, 6, 9);
    }

    function loop() {
      ctx.save();
      if (shake > 0.2) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake *= 0.85;
      }

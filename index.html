<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#3f5c3f" />
  <title>Battle of Kursk 1943 - Armored Simulation</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <div class="header-title"><strong>KURSK 1943</strong><span>· Prokhorovka</span></div>
    <span id="turn-indicator" class="turn-badge">TURNO: T-34</span>
  </header>

  <div id="canvas-container">
    <canvas id="battlefield"></canvas>
    <div id="hud">
      <div class="stat-box">
        <div class="stat-name">USSR · T-34/76</div>
        <div class="hp-bar"><div id="hp-t34" class="hp-fill" style="width:100%; background:#ef4444;"></div></div>
      </div>
      <div class="stat-box" style="text-align:right;">
        <div class="stat-name">GER · Tiger I</div>
        <div class="hp-bar"><div id="hp-tiger" class="hp-fill" style="width:100%; background:#94a3b8;"></div></div>
      </div>
    </div>
    <div id="fin-partida" class="overlay oculto">
      <h2 id="titulo-fin">¡VICTORIA!</h2>
      <p id="subtitulo-fin">El enemigo ha sido destruido</p>
      <button id="btn-reiniciar" class="btn-pass" onclick="resetBattle()">🔄 JUGAR DE NUEVO</button>
    </div>
  </div>

  <div id="controls">
  <button id="btn-pass"  class="btn-icon btn-pass"  onclick="passTurn()"     title="Pasar turno">⏭ PASAR</button>
  <button id="btn-music" class="btn-icon btn-music" onclick="toggleMusic()"  title="Música">🎵 OFF</button>
  <button id="rec-btn"   class="btn-icon btn-rec"   onclick="toggleRecording()" title="Grabar">● REC</button>
  <button                class="btn-icon btn-reset" onclick="resetBattle()"  title="Reiniciar">🔄</button>
</div>

  <script src="js/audio.js"></script>
  <script src="entities/board.js"></script>
<script src="entities/units.js"></script>
<script src="js/main.js"></script>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulación de Tanque - Código Puro</title>
  <style>
    body { margin: 0; background: #111; overflow: hidden; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; color: white; }
    canvas { background: linear-gradient(#1e293b, #475569); width: 100vw; height: 85vh; display: block; }
    button { margin-top: 10px; padding: 12px 24px; font-size: 16px; font-weight: bold; background: #ef4444; color: white; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <button onclick="fireCannon()">DISPARAR CAÑÓN</button>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight * 0.85;

    let tankX = canvas.width * 0.25;
    let recoil = 0;
    let particles = [];
    let shells = [];

    function fireCannon() {
      recoil = 15;
      const barrelEndX = tankX + 110;
      const barrelEndY = canvas.height * 0.72 - 38;
      shells.push({ x: barrelEndX, y: barrelEndY, vx: 18, vy: -1.5 });
      for (let i = 0; i < 25; i++) {
        particles.push({
          x: barrelEndX, y: barrelEndY,
          vx: Math.random() * 8 + 2, vy: (Math.random() - 0.5) * 6,
          size: Math.random() * 12 + 4, alpha: 1, color: i % 2 === 0 ? '#f97316' : '#94a3b8'
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const groundY = canvas.height * 0.72;

      // Terreno
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      // Movimiento y retroceso suave
      tankX += 0.4;
      if (tankX > canvas.width + 100) tankX = -150;
      recoil *= 0.85;
      const x = tankX - recoil;

      // Orugas
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.roundRect(x - 60, groundY - 22, 130, 22, 10);
      ctx.fill();

      // Chasis
      ctx.fillStyle = '#3f6212';
      ctx.fillRect(x - 50, groundY - 40, 110, 20);

      // Torreta y cañón
      ctx.fillStyle = '#4d7c0f';
      ctx.fillRect(x - 25, groundY - 56, 60, 18);
      ctx.fillRect(x + 35, groundY - 50, 75, 7);

      // Proyectiles
      shells.forEach((s, idx) => {
        s.x += s.vx; s.y += s.vy; s.vy += 0.05;
        ctx.fillStyle = '#fde047';
        ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI * 2); ctx.fill();
        if (s.x > canvas.width) shells.splice(idx, 1);
      });

      // Humo y fuego
      particles.forEach((p, idx) => {
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.025; p.size *= 1.02;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        if (p.alpha <= 0) particles.splice(idx, 1);
      });

      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>

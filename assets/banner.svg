<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#ff006e"/>
      <stop offset="100%" stop-color="#ffd60a"/>
    </linearGradient>
    <linearGradient id="scanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00e5ff" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <filter id="titleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="340" fill="url(#bg)"/>

  <rect width="1000" height="340" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="5s" repeatCount="indefinite"/>
  </rect>

  <rect x="0" y="0" width="1000" height="3" fill="url(#scanLine)">
    <animate attributeName="y" from="0" to="340" dur="3s" repeatCount="indefinite"/>
  </rect>

  <text x="500" y="140" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="76" font-weight="900" fill="url(#titleGrad)" letter-spacing="8" filter="url(#titleGlow)">
    KURSK 1943
    <animate attributeName="opacity" values="1;0.82;1" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <text x="500" y="198" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="20" fill="#00e5ff" letter-spacing="10">
    COMMAND · MANEUVER · SURVIVE
    <animate attributeName="opacity" values="0.95;0.55;0.95" dur="2s" repeatCount="indefinite"/>
  </text>

  <g transform="translate(160 250)">
    <rect x="-45" y="-5" width="90" height="22" fill="#00e5ff" opacity="0.85"/>
    <rect x="-18" y="-25" width="36" height="22" fill="#00e5ff" opacity="0.95">
      <animate attributeName="y" values="-25;-27;-25" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="15" y="-14" width="55" height="4" fill="#ffd60a">
      <animate attributeName="width" values="55;55;45;55;55" keyTimes="0;0.7;0.75;0.85;1" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(840 250) scale(-1 1)">
    <rect x="-45" y="-5" width="90" height="22" fill="#ff006e" opacity="0.85"/>
    <rect x="-18" y="-25" width="36" height="22" fill="#ff006e" opacity="0.95">
      <animate attributeName="y" values="-25;-27;-25" dur="1.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="15" y="-14" width="55" height="4" fill="#ffd60a"/>
  </g>

  <circle r="5" fill="#ffd60a">
    <animate attributeName="cx" values="215;215;790;790;790" keyTimes="0;0.72;0.9;0.92;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="236;236;236;236;236" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.71;0.74;0.9;0.93" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="790" cy="236" r="0" fill="#ffd60a" opacity="0">
    <animate attributeName="r" values="0;0;0;25;0;0" keyTimes="0;0.89;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.9;0.7;0;0" keyTimes="0;0.89;0.91;0.94;0.97;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <line x1="0" y1="295" x2="1000" y2="295" stroke="#ff006e" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </line>

  <text x="500" y="322" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#94a3b8" letter-spacing="4">
    BATTLE OF KURSK · 1943 · PURE JAVASCRIPT ENGINE
  </text>
</svg>